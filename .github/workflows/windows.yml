name: Windows build and verification
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build FontCrate.sln -c Release
      - run: dotnet test tests/FontCrate.Tests/FontCrate.Tests.csproj -c Release --no-build
      - name: Management state and compiled page verification
        run: dotnet run --project tools/FontCrate.ManagementVerify -c Release --no-build
      - name: Read-only DirectWrite and WIC smoke check
        shell: pwsh
        run: |
          dotnet run --project tools/FontCrate.Verify -c Release -- "$env:WINDIR/Fonts/arial.ttf"
          if ($LASTEXITCODE -ne 0) { throw 'Native render verification failed' }
      - run: ./tools/publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: FontCrate-win-x64
          path: artifacts/
